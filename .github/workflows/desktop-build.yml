name: Desktop Builds

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            desktop_utils_app/requirements.txt
            desktop_utils_app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_utils_app/requirements.txt -r desktop_utils_app/requirements-dev.txt

      - name: Build (PyInstaller)
        run: |
          python desktop_utils_app/build.py

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\QuickUtil\* -DestinationPath QuickUtil-windows.zip

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/QuickUtil.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/QuickUtil.app" "QuickUtil-macos.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/QuickUtil" "QuickUtil-macos.zip"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickUtil-${{ runner.os }}
          path: QuickUtil-*.zip

