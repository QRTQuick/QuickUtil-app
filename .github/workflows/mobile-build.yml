name: Mobile Builds

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter project
        run: python3 mobile_utils_app/bootstrap.py --out mobile_utils_app/app

      - name: Build APK + AAB
        working-directory: mobile_utils_app/app
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: QuickUtil-Android
          path: |
            mobile_utils_app/app/build/app/outputs/flutter-apk/app-release.apk
            mobile_utils_app/app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter project
        run: python3 mobile_utils_app/bootstrap.py --out mobile_utils_app/app

      - name: Build iOS app (.app)
        working-directory: mobile_utils_app/app
        run: |
          flutter --version
          flutter pub get
          flutter build ios --debug --simulator

      - name: Package iOS artifact
        run: |
          cd mobile_utils_app/app
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "build/ios/iphonesimulator/Runner.app" "../../QuickUtil-iOS-simulator.app.zip"
          else
            echo "Runner.app not found" && ls -R build/ios || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: QuickUtil-iOS
          path: QuickUtil-iOS-simulator.app.zip
